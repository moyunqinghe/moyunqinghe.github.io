<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨韵清河 · 喜欢就去做</title>
  <meta name="description" content="墨韵清河的个人主页 —— AI Agent 工程师。喜欢就去做。">
  <meta name="theme-color" content="#f6efe3">
  <meta property="og:title" content="墨韵清河 · 喜欢就去做">
  <meta property="og:description" content="墨韵清河的个人主页 —— AI Agent 工程师。喜欢就去做。">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 暖阳画布：光标所至，光与微尘随行 -->
  <canvas id="sun" aria-hidden="true"></canvas>

  <main class="page">
    <!-- 名片区 -->
    <header class="card">
      <img class="avatar" src="assets/avatar.svg" alt="墨韵清河的头像">
      <h1 class="name">墨韵清河</h1>
      <p class="role">AI Agent 工程师</p>
      <p class="motto">喜欢就去做</p>
    </header>

    <!-- 找到我 -->
    <section class="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">找到我</h2>
      <ul class="contact-list">
        <li>
          <a class="contact-item" href="mailto:zzhdyyds@gmail.com">
            <span class="platform">Email</span>
            <span class="handle">zzhdyyds@gmail.com</span>
          </a>
        </li>
        <li>
          <a class="contact-item" href="https://github.com/moyunqinghe" target="_blank" rel="noopener">
            <span class="platform">GitHub</span>
            <span class="handle">moyunqinghe</span>
          </a>
        </li>
        <li>
          <a class="contact-item" href="https://space.bilibili.com/299503081" target="_blank" rel="noopener">
            <span class="platform">B站</span>
            <span class="handle">space.bilibili.com/299503081</span>
          </a>
        </li>
      </ul>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
      <p>© 2026 墨韵清河</p>
    </footer>
  </main>

  <!-- 边框随心：每次刷新随机生长一个有机形状 + 一点随性的倾斜。
       不引任何库，纯原生。关掉 JS 也有 CSS 兜底形状。 -->
  <script>
    (function () {
      function r(min, max) { return Math.round(min + Math.random() * (max - min)); }
      function rf(min, max) { return +(min + Math.random() * (max - min)).toFixed(2); }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      /* 名片：自由生长的有机形状 + 随性倾斜 */
      var card = document.querySelector('.card');
      if (card) {
        card.style.borderRadius =
          r(30, 70) + '% ' + r(30, 70) + '% ' + r(30, 70) + '% ' + r(30, 70) + '% / ' +
          r(38, 62) + '% ' + r(38, 62) + '% ' + r(38, 62) + '% ' + r(38, 62) + '%';
        card.style.setProperty('--tilt', rf(-1.6, 1.6) + 'deg');
      }

      /* 暖光：每次刷新轻微漂移 */
      document.body.style.setProperty('--glow-x', r(38, 62) + '%');
      document.body.style.setProperty('--glow-y', r(8, 26) + '%');

      /* 找到我：三行各自一点手裁圆角 + 小倾斜 */
      document.querySelectorAll('.contact-item').forEach(function (item) {
        item.style.borderRadius =
          r(8, 20) + 'px ' + r(8, 20) + 'px ' + r(8, 20) + 'px ' + r(8, 20) + 'px';
        item.style.setProperty('--tilt', rf(-0.5, 0.5) + 'deg');
      });

      /* 名字：字重/字距轻微随机，像每次手写一遍 */
      var name = document.querySelector('.name');
      if (name) {
        name.style.fontWeight = pick([500, 600, 700]);
        name.style.letterSpacing = rf(0.05, 0.12) + 'em';
      }
    })();
  </script>
  <!-- 暖阳拖尾：只在精确指针(鼠标)且未开启"减弱动效"时点亮 -->
  <script>
    (function () {
      if (!matchMedia('(pointer: fine)').matches) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var canvas = document.getElementById('sun');
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W, H;
      function resize() {
        W = canvas.width = innerWidth * dpr;
        H = canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
      }
      resize();
      addEventListener('resize', resize);

      var glow = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2, on: false };
      var parts = [];
      var last = null;

      function spawn(x, y, burst) {
        if (parts.length > 110) parts.shift();
        var a = Math.random() * Math.PI * 2;
        var s = burst ? Math.random() * 2.4 + 0.6 : Math.random() * 0.6 + 0.12;
        parts.push({
          x: x, y: y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s - 0.25,   /* 微尘略向上飘 */
          r: Math.random() * 2.2 + 0.8,
          life: 1,
          decay: Math.random() * 0.02 + 0.014,
          hue: 28 + Math.random() * 20  /* 金 -> 赭 */
        });
      }

      addEventListener('pointermove', function (e) {
        glow.tx = e.clientX; glow.ty = e.clientY; glow.on = true;
        if (!last) { last = { x: e.clientX, y: e.clientY }; return; }
        var dist = Math.hypot(e.clientX - last.x, e.clientY - last.y);
        var n = Math.min(3, Math.floor(dist / 14));   /* 走得越远，撒得越多 */
        for (var i = 0; i < n; i++) spawn(e.clientX, e.clientY, false);
        last = { x: e.clientX, y: e.clientY };
      });
      addEventListener('pointerdown', function (e) {
        for (var i = 0; i < 14; i++) spawn(e.clientX, e.clientY, true);
      });
      document.addEventListener('pointerleave', function () { glow.on = false; last = null; });

      function tick() {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        ctx.scale(dpr, dpr);

        /* 太阳：暖光柔和地追上手标 */
        glow.x += (glow.tx - glow.x) * 0.14;
        glow.y += (glow.ty - glow.y) * 0.14;
        if (glow.on) {
          var g = ctx.createRadialGradient(glow.x, glow.y, 0, glow.x, glow.y, 150);
          g.addColorStop(0, 'rgba(255, 190, 105, 0.22)');
          g.addColorStop(1, 'rgba(255, 190, 105, 0)');
          ctx.fillStyle = g;
          ctx.fillRect(glow.x - 150, glow.y - 150, 300, 300);
        }

        /* 拖尾微尘 */
        for (var i = parts.length - 1; i >= 0; i--) {
          var p = parts[i];
          p.x += p.vx; p.y += p.vy; p.life -= p.decay;
          if (p.life <= 0) { parts.splice(i, 1); continue; }
          ctx.globalAlpha = p.life * 0.8;
          ctx.fillStyle = 'hsl(' + p.hue + ', 72%, 55%)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
